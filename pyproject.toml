[project]
name = "cintel"
version = "0.1.0"
description = "Competitive Intelligence Retrieval fuer die LoopForgeLab Master DB"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
cintel = "cintel.cli:main"

[tool.setuptools]
packages = ["cintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]

# Bewusste Ausnahmen:
#   B008 - Default-Argumente per Aufruf werden hier nicht verwendet
#   SIM105 - contextlib.suppress verschleiert die Absicht bei Netzfehlern
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# conftest muss sys.path setzen, BEVOR cintel importiert wird.
"tests/conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]
# Tests greifen absichtlich auf interne Helfer zu.
"tests/*.py" = ["SLF001"]
# Das Handbuch enthaelt Befehlszeilen, die der Leser kopieren soll. Sie
# duerfen nicht umbrochen werden und sind teils laenger als 100 Zeichen.
"docs/build_handbuch.py" = ["E501"]
