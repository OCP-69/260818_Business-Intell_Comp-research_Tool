# Steuerdatei fuer die Recherche-Laeufe.
#
# Zwei Modi:
#   mode: gaps  -> bestehende Firmen der Master-DB anreichern (keine Neuzugaenge)
#   mode: new   -> neue Firmen im Markt entdecken
#
# Der erste Lauf ist bewusst "gaps": die Pipeline arbeitet gegen 374 bekannte
# Firmen, deren Wahrheit du kennst. Damit ist die Extraktionsqualitaet sofort
# beurteilbar, bevor unbekannte Firmen in die DB kommen.

mode: gaps

# ---------------------------------------------------------------- gaps-Modus
gaps:
  # Spalten, deren Fuellgrad in v2.2 zu niedrig ist. Reihenfolge = Prioritaet.
  # Fuellgrade v2.2: Product_name 58%, All_Key_Categories 41%, R-Strategies 12%
  target_columns:
    - "Product_name"
    - "All_Key_Categories of this company"
    - "R-Strategies"
    - "Remarks Product/solution"

  # Nur Firmen bearbeiten, die mindestens eine dieser Spalten leer haben.
  only_incomplete: true

  # Firmen mit diesen Tiers zuerst (Tier 1 = direkte Wettbewerber).
  tier_priority:
    - "Tier 1 \u2013 Direkt"
    - "Tier 2 \u2013 Nachbar"
    - "Tier 3 \u2013 Beobachten"

  # Firmen ohne brauchbare URL ueberspringen (koennen nicht gecrawlt werden).
  require_url: true

# ----------------------------------------------------------------- new-Modus
new:
  # Zielsektoren. Jede Kombination wird zu einer eigenen Discovery-Suche.
  # Werte MUESSEN aus config/taxonomy.yaml stammen.
  key_categories:
    - "5. Sustainability & Compliance (LCA/DPP)"
    - "6. Industrial AI & Future Engineering"
  sub_categories:
    - "LCA Software & Platforms"
    - "Carbon & Eco-Design"
    - "Engineering Copilots & AI Assistants"
    - "Supply Chain & RFQ & CPQ"

  regions:
    - "DACH"
    - "Europe"

  # Zielfunktionsbereich: Startups. Leere Liste = keine Stage-Filterung.
  stages:
    - "Seed"
    - "Series A"
    - "Series B"
    - "Startup"

  inclusion_criteria: >
    B2B-Software fuer diskrete Fertigung, Produktentwicklung oder Engineering.
    Eigenes Produkt (kein reines Beratungshaus).
  exclusion_criteria: >
    Reine Beratungs- und Agenturgeschaefte ohne Produkt. Reine
    Consumer-Anwendungen. Konzerne > 5000 Mitarbeiter.

  max_per_cell: 10

# -------------------------------------------------------------------- Limits
limits:
  max_companies_per_run: 25      # harte Obergrenze pro Lauf
  max_pages_per_company: 12      # Crawl-Budget je Firma
  max_products_per_company: 25   # Produktzeilen je Firma
  crawl_delay_seconds: 1.5       # Hoeflichkeit gegenueber den Zielseiten
  request_timeout_seconds: 20

llm:
  model: "sonnet"                # sonnet | opus | haiku
  discovery_model: "sonnet"
  timeout_seconds: 600
  max_retries: 2
